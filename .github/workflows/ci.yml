name: build-and-test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++
            mode: Release
            sanitizer: 'OFF'
            portable: 'OFF'
          - os: ubuntu-latest
            compiler: clang++
            mode: Debug
            sanitizer: 'OFF'
            portable: 'OFF'
          - os: ubuntu-latest
            compiler: clang++
            mode: Debug
            sanitizer: 'ON'
            portable: 'OFF'
          - os: ubuntu-latest
            compiler: g++
            mode: Release
            sanitizer: 'OFF'
            portable: 'ON'
    runs-on: ${{ matrix.os }}
    env:
      CXX: ${{ matrix.compiler }}
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=${{ matrix.mode }} -DKVQUERY_SANITIZERS=${{ matrix.sanitizer }} -DKVQUERY_FORCE_PORTABLE_SIMD=${{ matrix.portable }}
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure

  online-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake-env"
          "$RUNNER_TEMP/cmake-env/bin/pip" install cmake==3.31.6
          echo "$RUNNER_TEMP/cmake-env/bin" >> "$GITHUB_PATH"
      - name: Configure combined engine
        run: cmake -S . -B build/online -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DKVQUERY_ONLINE_INDEX=ON -DENGINE_BUNDLED_DEPS=ON
      - name: Build online worker and snapshot builder
        run: cmake --build build/online --target online_index_worker online_index --parallel 2
