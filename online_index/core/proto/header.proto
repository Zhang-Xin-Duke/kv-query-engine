syntax = "proto2";
package index_engine;

message TableHeader {
  required uint32 version = 1;
  enum FileType {
    SNAPSHOT = 1;
    DELTA = 2;
    INCREMENTAL = 3;
    IMMUTABLE = 4;
  };

  optional FileType type = 2;
  optional fixed32 item_count = 3;
  optional uint32 bucket_count = 4;
  repeated uint64 offsets = 5;
  optional uint32 fixed_value_size = 6;
  optional uint32 chunk_size = 7;
  optional int32 datatype = 8;
};

message TableFooter {
  required bytes md5 = 1;
  optional uint64 item_count = 2;
  optional uint32 max_value_size = 3;
  optional int32 datatype = 4;
  optional uint64 metrics_total_length = 5;
  optional uint64 metrics_total_lowest = 6;
  optional uint64 metrics_total_max = 7;
};
