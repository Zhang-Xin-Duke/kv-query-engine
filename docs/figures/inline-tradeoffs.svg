 <desc id="inline-tradeoffs-desc">Paired SIMD ratios increase with inline payload length: six-byte values improve 31.0%. Seven and 32-byte controls remain external. An even mix of six and 32-byte values regresses 4.0%. Whiskers show paired process ranges.</desc><title id="inline-tradeoffs-title">Inlining gains and the mixed-value tradeoff</title><title>Inlining gains and the mixed-value tradeoff</title>
